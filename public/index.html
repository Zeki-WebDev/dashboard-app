<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --surface:#fff; --text:#1d2433; --muted:#6b7385; --line:#dfe3ea; --accent:#1f6feb; --danger:#c8382f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --surface:#1c212c; --text:#e8ebf2; --muted:#98a0b3; --line:#2c3342; --accent:#5b9cff; --danger:#ff7b72; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0; } h2 { font-size:1rem; margin:0 0 12px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  header span { color:var(--muted); font-size:.9rem; margin-right:8px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
  .stat span { color:var(--muted); font-size:.85rem; } .stat b { display:block; font-size:1.6rem; margin-top:4px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width:720px) { .row { grid-template-columns:1fr; } }
  form { display:grid; gap:8px; }
  input, button { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  button.ghost { background:none; color:var(--text); border:1px solid var(--line); }
  button.del { background:none; color:var(--danger); padding:2px 6px; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .msg { min-height:1.2em; font-size:.85rem; color:var(--danger); }
  #auth { max-width:360px; margin:12vh auto 0; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
</style>
</head>
<body>
<main>
  <section id="auth" class="panel" hidden>
    <h1>Orders dashboard</h1>
    <p style="color:var(--muted)">Sign in to see your orders.</p>
    <form id="auth-form">
      <input name="email" type="email" placeholder="Email" autocomplete="email" required>
      <input name="password" type="password" placeholder="Password (6+ characters)" minlength="6" autocomplete="current-password" required>
      <div class="btns">
        <button type="submit">Sign in</button>
        <button type="button" class="ghost" id="signup">Create account</button>
      </div>
      <div id="auth-msg" class="msg" role="alert"></div>
    </form>
  </section>

  <div id="app" hidden>
    <header>
      <h1>Orders dashboard</h1>
      <div><span id="who"></span><button class="ghost" id="signout">Sign out</button></div>
    </header>

    <section class="stats">
      <div class="panel stat"><span>Total orders</span><b id="s-orders">–</b></div>
      <div class="panel stat"><span>Revenue</span><b id="s-revenue">–</b></div>
      <div class="panel stat"><span>Average order</span><b id="s-avg">–</b></div>
    </section>

    <section class="row">
      <div class="panel"><h2>Revenue by product</h2><canvas id="chart" height="200"></canvas></div>
      <div class="panel">
        <h2>Add order</h2>
        <form id="form">
          <input name="customer" placeholder="Customer" required>
          <input name="product" placeholder="Product" required>
          <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
          <button type="submit">Add order</button>
          <div id="msg" class="msg" role="alert"></div>
        </form>
      </div>
    </section>

    <section class="panel">
      <h2>Recent orders</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Customer</th><th>Product</th><th>Amount</th><th>Date</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const money = n => '$' + Number(n).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb, token = null, userId = null, chart;

async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

async function load() {
  try {
    const [orders, stats] = await Promise.all([api('/api/orders'), api('/api/orders/stats')]);
    $('s-orders').textContent = stats.totalOrders;
    $('s-revenue').textContent = money(stats.revenue);
    $('s-avg').textContent = money(stats.average);

    if (chart) chart.destroy();
    chart = new Chart($('chart'), {
      type: 'bar',
      data: { labels: Object.keys(stats.byProduct),
              datasets: [{ data: Object.values(stats.byProduct), backgroundColor: '#1f6feb' }] },
      options: { plugins: { legend: { display: false } } }
    });

    $('rows').innerHTML = orders.map(o => `
      <tr><td>${esc(o.customer)}</td><td>${esc(o.product)}</td><td>${money(o.amount)}</td>
      <td>${new Date(o.created_at).toLocaleDateString()}</td>
      <td><button class="del" data-id="${o.id}" aria-label="Delete order">Delete</button></td></tr>`
    ).join('') || '<tr><td colspan="5">No orders yet. Add your first one above.</td></tr>';
  } catch (e) { $('msg').textContent = e.message; }
}

// Don't call supabase methods inside this callback (supabase-js can deadlock).
function onSession(session) {
  token = session ? session.access_token : null;
  const newUser = session ? session.user.id : null;
  $('auth').hidden = !!session;
  $('app').hidden = !session;
  if (session && newUser !== userId) { $('who').textContent = session.user.email; load(); }
  userId = newUser;
}

$('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  $('auth-msg').textContent = '';
  const { email, password } = Object.fromEntries(new FormData(e.target));
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) $('auth-msg').textContent = error.message;
});

$('signup').addEventListener('click', async () => {
  const f = $('auth-form');
  if (!f.reportValidity()) return;
  const { email, password } = Object.fromEntries(new FormData(f));
  const { data, error } = await sb.auth.signUp({ email, password });
  $('auth-msg').textContent = error ? error.message
    : data.session ? '' : 'Account created. Check your email to confirm, then sign in.';
});

$('signout').addEventListener('click', () => sb.auth.signOut());

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('msg').textContent = '';
  try {
    await api('/api/orders', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    e.target.reset();
    load();
  } catch (err) { $('msg').textContent = err.message; }
});

$('rows').addEventListener('click', async e => {
  const id = e.target.dataset.id;
  if (!id) return;
  try { await api('/api/orders/' + id, { method: 'DELETE' }); load(); }
  catch (err) { $('msg').textContent = err.message; }
});

(async () => {
  const cfg = await (await fetch('/api/config')).json();
  sb = supabase.createClient(cfg.url, cfg.anonKey);
  sb.auth.onAuthStateChange((_event, session) => onSession(session));
})();
</script>
</body>
</html>
